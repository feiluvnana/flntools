[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "parsel>=1.9.0",
]

[project.optional-dependencies]
http = ["httpx>=0.27.0"]
browser = ["playwright>=1.40.0", "httpx>=0.27.0"]
crypto = ["cryptography>=42"]
scrape = ["parsel>=1.9.0"]

[project.scripts]
flnd = "flnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["flnd", "shared"]

[dependency-groups]
dev = ["pyright==1.1.414", "typing_extensions>=4.12"]

[tool.pyright]
include = ["shared", "flnd", "tests/typing"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "playwright==1.65.*",
    "parsel>=1.9.0",
    "python-jsonpath",
    "cryptography>=42",
    "telethon>=1.36",
    "qrcode>=7.4",
    "pillow>=11.3",
    "pi-heif>=1.0",
    "imageio-ffmpeg>=0.6",
]

# For shared alone, without flnd. flnd's dependencies already hold what these add, except
# `archive`'s: flnd saves archives as sent and never opens one.
[project.optional-dependencies]
archive = ["pyzipper", "py7zr"]
selector = ["parsel>=1.9.0", "python-jsonpath"]
# httpx for `fetch`, and `selector`'s packages for `Response.html`.
http = ["httpx>=0.27.0", "parsel>=1.9.0", "python-jsonpath"]
# Pinned to a minor version: every Playwright release downloads a new browser build.
browser = ["playwright==1.65.*", "cryptography>=42"]
media = ["pillow>=11.3", "pi-heif>=1.0", "imageio-ffmpeg>=0.6"]
# `Media.labels` and `flnd --classify`: the CLIP model runs on ONNX Runtime, its arrays in NumPy.
# Offered for install the first time it is needed; `dist` bundles it.
classify = ["onnxruntime>=1.20", "numpy>=2"]

[project.scripts]
flnd = "flnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["flnd", "shared"]

[dependency-groups]
# pyright[nodejs] brings its own Node.js wheel, so `type` downloads nothing and works on Windows.
# packaging reads flnd's dependency markers for the licence test; PyInstaller used to bring it in.
dev = ["pyright[nodejs]==1.1.414", "typing_extensions>=4.12", "packaging"]
# Only `scripts/dev.py dist` needs PyInstaller, and it syncs this group itself.
dist = ["pyinstaller>=6"]

[tool.uv]
default-groups = ["dev"]

[tool.pyright]
include = ["shared", "flnd", "tests/typing", "tests/fakes.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

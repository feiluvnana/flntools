[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "playwright==1.65.*",
    "parsel>=1.9.0",
    "python-jsonpath",
    "cryptography>=42",
    "telethon>=1.36",
    "cryptg>=0.5",
    "qrcode>=7.4",
    "rich",
    "questionary",
    "cyclopts",
    "filelock",
    "msgspec",
]

[project.scripts]
flnd = "flnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["flnd"]

[dependency-groups]
# The tools `make` runs: ruff for `make lint`, pdoc for `make docs`, and pyright for `make type`.
# pyright[nodejs] brings its own Node.js wheel, so `make type` downloads nothing and works on Windows.
dev = ["ruff>=0.14", "pdoc>=15", "pyright[nodejs]==1.1.414"]
# Only `make dist` needs PyInstaller; its recipe adds this group with `uv run --group dist`.
dist = ["pyinstaller>=6"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# The floor `requires-python` promises, so `UP` never suggests syntax 3.11 can't run.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A small, named rule set: undefined and unused names (F), syntax errors (E9), likely bugs
# (B, bugbear), syntax older than the floor version (UP) and import order (I).
select = ["F", "E9", "B", "UP", "I"]
ignore = [
    # Off until every module is rewritten for human readers: sorting imports and moving to the
    # newer syntax touch about 80 files and 600 lines, which would bury this commit's change.
    # The pass that documents every module (PLAN.md, row 15.21) turns both on.
    "I",
    "UP",
    # `zip(strict=)` needs a decision per call, and many zips here pair a list with its own tail
    # or a pattern with a longer path on purpose.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# A test reads an attribute only to see it raise (`with self.assertRaises(...): page.document`).
"tests/**" = ["B018"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: a shared default instance can't be changed, so B008 has nothing to warn of.
extend-immutable-calls = ["flnd.options.Options", "flnd.source.Range"]

[tool.pyright]
# `make type` names the public modules itself; this only says how to read them. Informational:
# pyright is not part of `make check`.
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

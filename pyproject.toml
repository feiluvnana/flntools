[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "parsel>=1.9.0",
    "python-jsonpath",
    "cryptography>=42",
    "telethon>=1.36",
    "qrcode>=7.4",
    "pyzipper",
    "py7zr",
    "pillow>=11.3",
    "pi-heif>=1.0",
    "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
archive = ["pyzipper", "py7zr"]
selector = ["parsel>=1.9.0", "python-jsonpath"]
browser = ["playwright>=1.40.0", "cryptography>=42"]
bundler = ["pyinstaller>=6"]
media = ["pillow>=11.3", "pi-heif>=1.0", "imageio-ffmpeg>=0.6"]

[project.scripts]
flnd = "flnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["flnd", "shared"]

[dependency-groups]
dev = ["pyright==1.1.414", "typing_extensions>=4.12"]

[tool.pyright]
include = ["shared", "flnd", "tests/typing", "tests/fakes.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "playwright==1.65.*",
    "parsel>=1.9.0",
    "python-jsonpath",
    "cryptography>=42",
    "telethon>=1.36",
    "cryptg>=0.5",
    "qrcode>=7.4",
    "rich",
    "questionary",
    "cyclopts",
    "filelock",
    "msgspec",
]

[project.scripts]
flnd = "flnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["flnd"]

[dependency-groups]
# pyright[nodejs] brings its own Node.js wheel, so `type` downloads nothing and works on Windows.
dev = ["pyright[nodejs]==1.1.414", "typing_extensions>=4.12"]
# Only `scripts/dev.py dist` needs PyInstaller, and it syncs this group itself.
dist = ["pyinstaller>=6"]

[tool.uv]
default-groups = ["dev"]

[tool.pyright]
include = ["flnd", "tests/typing", "tests/fakes.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

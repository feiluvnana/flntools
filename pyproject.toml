[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "parsel>=1.9.0",
]

[project.scripts]
flnd = "flnd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flnd", "shared", "loix"]

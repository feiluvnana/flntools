[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flnkit"
version = "0.1.0"
description = "Shared toolkit for flntools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["rich"]
web = ["curl_cffi>=0.17,<0.18", "playwright==1.65.*", "selectolax>=0.3.27"]

[tool.setuptools]
packages = ["flnkit", "flnkit.ui"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I", "ASYNC", "RUF006"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["flnkit"]

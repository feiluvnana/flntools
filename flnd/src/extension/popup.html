<!doctype html>
<!-- flnd's popup: this tab's target and media, with Get and Follow (SPEC.md#the-chrome-extension). -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
    body { margin: 0; padding: 12px; width: 320px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { margin: 4px 0; overflow-wrap: anywhere; }
    .quiet { opacity: 0.7; }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul { list-style: none; margin: 4px 0; padding: 0; }
    button { font: inherit; }
  </style>
</head>
<body>
  <h1>flnd</h1>
  <section id="target"><p class="quiet">Asking flnd about this tab…</p></section>
  <section id="allow"></section>
  <h1>Media</h1>
  <ul id="media"><li class="quiet">Looking…</li></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>

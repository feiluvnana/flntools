[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flntools"
version = "0.1.0"
description = "Dead simple media downloader for TikTok, Facebook, Instagram, and Twitter/X"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The HTTP client: libcurl with Chrome's TLS and HTTP/2 fingerprint, on the run's asyncio loop.
    # Pinned to 0.17: flnkit/net.py sets up curl_cffi's handles itself, from its internals.
    "curl_cffi>=0.17,<0.18",
    "playwright==1.65.*",
    # HTML parsing: lexbor's C parser and CSS engine, imported only by `flnd._html`.
    "selectolax>=0.3.27",
    "cryptography>=42",
    "telethon>=1.36",
    "cryptg>=0.5",
    "qrcode>=7.4",
    "rich",
    "msgspec",
    # Edits config.toml in place, keeping the comments a person wrote (src/engine/config.py).
    "tomlkit>=0.13",
    # The lists and forms, inline under the prompt (`src/ui/lists.py`, `src/ui/forms.py`):
    # `ui.open` measured 100 ms to a list's first frame, under P17's 250 ms.
    "textual>=8.2",
]

[project.scripts]
flnd = "flnd.cli:main"

[tool.setuptools]
# src/ installs as the package flnd; flnkit/ ships beside it (PLAN.md 4.1). Setuptools maps the
# folder src/ to the name flnd, which hatchling's dev mode cannot do (it rejects such a rewrite).
# setup.py only moves the egg-info into build/, as no pyproject setting can.
packages = ["flnd", "flnd.engine", "flnd.ui", "flnd.sources", "flnd.docs", "flnd.docs.sources",
            "flnd.extension", "flnkit"]
package-dir = {"flnd" = "src", "flnkit" = "flnkit"}

[tool.setuptools.package-data]
# The docs and the Chrome extension are data in folders without an __init__.py: listed as
# packages, so setuptools ships them and does not warn that they are absent.
flnd = ["py.typed"]
"flnd.docs" = ["*.md"]
"flnd.docs.sources" = ["*.md"]
"flnd.extension" = ["*.json", "*.js", "*.html"]

[dependency-groups]
# The tools `make` runs: ruff for `make lint` and pdoc for `make docs`; pyte draws a terminal in
# the screen's tests.
dev = ["ruff>=0.14", "pdoc>=15", "pyte>=0.8"]
# Only `make dist` needs PyInstaller; its recipe adds this group with `uv run --group dist`.
dist = ["pyinstaller>=6"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# The floor `requires-python` promises, so `UP` never suggests syntax 3.11 can't run.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A small, named rule set, and the one checker: undefined and unused names (F), syntax errors
# (E9), likely bugs (B, bugbear), syntax older than the floor version (UP), import order (I),
# blocking calls inside coroutines (ASYNC), and a task nothing keeps (RUF006).
select = ["F", "E9", "B", "UP", "I", "ASYNC", "RUF006"]
ignore = [
    # `zip(strict=)` needs a decision per call, and many zips here pair a list with its own tail
    # or a pattern with a longer path on purpose.
    "B905",
]

[tool.ruff.lint.isort]
# The first-party packages, for import order (I): flnd and the standalone flnkit.
known-first-party = ["flnd", "flnkit"]
[tool.ruff.lint.per-file-ignores]
# A test reads an attribute only to see it raise (`with self.assertRaises(...): page.document`).
"tests/**" = ["B018"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: a shared default instance can't be changed, so B008 has nothing to warn of.
extend-immutable-calls = ["flnd.engine.options.Options", "flnd.source.Range"]
